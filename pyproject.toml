[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-workflow"
version = "0.2.0"
description = "Project-agnostic workflow orchestration engine"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools]
packages = ["maestro"]
