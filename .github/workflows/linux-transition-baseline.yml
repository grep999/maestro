name: Linux Office Baseline checks

on:
  pull_request:
    paths:
      - "projects/linux-transition-foundry/**"
  push:
    branches:
      - "project/linux-transition-foundry"
    paths:
      - "projects/linux-transition-foundry/**"

permissions:
  contents: read

jobs:
  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Install collection dependencies
        working-directory: projects/linux-transition-foundry/ansible
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        working-directory: projects/linux-transition-foundry/ansible
        run: ansible-playbook -i inventory/lab.yml site.yml --syntax-check
