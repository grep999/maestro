name: Maestro validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate packet contracts
        run: python3 scripts/validate_contracts.py
      - name: Run workflow engine tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile runtime
        run: python3 -m compileall -q maestro scripts tests
